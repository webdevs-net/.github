<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Anton'; src: url('fonts/Anton.ttf') format('truetype'); }
  @font-face { font-family: 'Jakarta'; src: url('fonts/Jakarta.ttf') format('truetype'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 452px; background: #000; }

  .wrap { width: 1280px; height: 452px; background: #000; padding: 30px 40px 34px; }

  .head { display: flex; align-items: baseline; gap: 18px; margin-bottom: 24px; }
  .kicker {
    font-family: 'Jakarta', sans-serif; font-weight: 800; font-size: 11px;
    letter-spacing: 0.28em; text-transform: uppercase; color: #cf5230;
  }
  .head h2 {
    font-family: 'Anton', sans-serif; font-size: 40px; text-transform: uppercase;
    color: #d1d1cf; letter-spacing: 0.01em; line-height: 1;
  }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }

  .card { position: relative; border-radius: 16px; overflow: hidden; background: #0d0d0d; }
  .card .shot { height: 218px; overflow: hidden; }
  .card .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .card .fade {
    position: absolute; left: 0; right: 0; top: 158px; height: 60px;
    background: linear-gradient(180deg, rgba(13,13,13,0) 0%, rgba(13,13,13,1) 100%);
  }
  .card .meta { padding: 18px 20px 20px; background: #0d0d0d; }
  .card .name {
    font-family: 'Anton', sans-serif; font-size: 26px; text-transform: uppercase;
    color: #fff; line-height: 1.05;
  }
  .card .type {
    display: inline-block; margin-top: 10px;
    font-family: 'Jakarta', sans-serif; font-weight: 700; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: #fff;
    background: #cf5230; border-radius: 999px; padding: 6px 12px;
  }
  .card .bar { position: absolute; left: 0; top: 0; width: 100%; height: 4px; background: #cf5230; }
  .card:nth-child(2) .bar, .card:nth-child(4) .bar { background: #CAC18B; }
  .card:nth-child(2) .type, .card:nth-child(4) .type { background: #CAC18B; color: #111; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="kicker">Portfolio</span>
      <h2>Selected Work</h2>
    </div>
    <div class="grid">
      <div class="card">
        <div class="shot"><img src="works/photosurgeon.jpg" /></div>
        <div class="fade"></div><div class="bar"></div>
        <div class="meta"><div class="name">Photosurgeon</div><span class="type">Web App</span></div>
      </div>
      <div class="card">
        <div class="shot"><img src="works/Park-Plaza.jpg" /></div>
        <div class="fade"></div><div class="bar"></div>
        <div class="meta"><div class="name">Park Plaza</div><span class="type">Website</span></div>
      </div>
      <div class="card">
        <div class="shot"><img src="works/TiAmoVali.png" /></div>
        <div class="fade"></div><div class="bar"></div>
        <div class="meta"><div class="name">Ti Amo Vail</div><span class="type">Mobile App</span></div>
      </div>
      <div class="card">
        <div class="shot"><img src="works/colleenwilcox.png" /></div>
        <div class="fade"></div><div class="bar"></div>
        <div class="meta"><div class="name">Colleen Wilcox</div><span class="type">Sculpture</span></div>
      </div>
    </div>
  </div>
</body>
</html>
