<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Anton'; src: url('fonts/Anton.ttf') format('truetype'); }
  @font-face { font-family: 'Jakarta'; src: url('fonts/Jakarta.ttf') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1280px; height: 440px; background: #000; }

  .banner {
    position: relative;
    width: 1280px;
    height: 440px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .bg {
    position: absolute;
    inset: -20px;
    background-image: url('hero.webp');
    background-size: cover;
    background-position: center 35%;
    filter: blur(3px) saturate(0.9);
    transform: scale(1.06);
  }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.66); }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 100%);
  }

  .content { position: relative; text-align: center; padding: 0 48px; }

  .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-bottom: 22px;
  }
  .eyebrow svg { width: 22px; height: 22px; fill: #cf5230; }
  .eyebrow span {
    font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 0.06em;
    color: #fff; text-transform: uppercase;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    line-height: 0.9;
    font-weight: 400;
  }
  h1 .solid { display: block; color: #d1d1cf; font-size: 74px; letter-spacing: 0.01em; }
  h1 .stroke {
    display: block; font-size: 74px; letter-spacing: 0.01em;
    color: transparent; -webkit-text-stroke: 2px #d1d1cf;
  }

  p.sub {
    font-family: 'Jakarta', sans-serif;
    font-size: 18px; line-height: 1.6; color: rgba(255,255,255,0.9);
    max-width: 760px; margin: 26px auto 0;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 30px; }
  .tags span {
    font-family: 'Jakarta', sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px; padding: 9px 18px;
  }

  .rule {
    position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
    background: linear-gradient(90deg, #cf5230 0%, #cf5230 55%, #CAC18B 55%, #CAC18B 100%);
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="bg"></div>
    <div class="scrim"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="eyebrow">
        <svg viewBox="0 0 640 512" xmlns="http://www.w3.org/2000/svg"><path d="M392.8 1.2c-17-4.9-34.7 5-39.6 22l-128 448c-4.9 17 5 34.7 22 39.6s34.7-5 39.6-22l128-448c4.9-17-5-34.7-22-39.6zm80.6 120.1c-12.5 12.5-12.5 32.8 0 45.3L562.7 256l-89.4 89.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l112-112c12.5-12.5 12.5-32.8 0-45.3l-112-112c-12.5-12.5-32.8-12.5-45.3 0zm-306.7 0c-12.5-12.5-32.8-12.5-45.3 0l-112 112c-12.5 12.5-12.5 32.8 0 45.3l112 112c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256l89.4-89.4c12.5-12.5 12.5-32.8 0-45.3z"/></svg>
        <span>WEBDEVS.NET</span>
      </div>

      <h1>
        <span class="solid">NO PROMPT GLITTER</span>
        <span class="stroke">JUST PRODUCTION ENGINEERING</span>
      </h1>

      <p class="sub">Custom AI applications, agents, and intelligent workflow systems, backed by serious software engineering.</p>

      <div class="tags">
        <span>AI Applications</span>
        <span>Machine Learning</span>
        <span>AI Agents</span>
        <span>Systems Integration</span>
        <span>MLOps</span>
      </div>
    </div>

    <div class="rule"></div>
  </div>
</body>
</html>
