<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Anton'; src: url('fonts/Anton.ttf') format('truetype'); }
  @font-face { font-family: 'Jakarta'; src: url('fonts/Jakarta.ttf') format('truetype'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }

  /* One card per render. build.sh passes ?i=<index> and the matching window size,
     so each card can be wrapped in its own link in the README. */
  .sys { position: relative; width: 400px; height: 240px; background: #0d0d0d;
    border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; padding: 18px 20px 16px; }
  .sys .tick { position: absolute; left: 0; top: 0; width: 100%; height: 3px;
    border-radius: 16px 16px 0 0; }
  .sys .role { font-family: 'Jakarta', sans-serif; font-weight: 800; font-size: 9.5px;
    letter-spacing: 0.2em; text-transform: uppercase; }
  .sys h3 { font-family: 'Anton', sans-serif; font-size: 27px; text-transform: uppercase;
    color: #fff; margin: 8px 0 10px; line-height: 1.05; }
  .sys p { font-family: 'Jakarta', sans-serif; font-size: 12.5px; line-height: 1.55;
    color: rgba(255,255,255,0.74); }
  .sys .stack { position: absolute; left: 20px; right: 20px; bottom: 16px;
    font-family: 'Jakarta', sans-serif; font-weight: 700; font-size: 10px;
    letter-spacing: 0.02em; color: rgba(255,255,255,0.5);
    border-top: 1px solid rgba(255,255,255,0.10); padding-top: 12px; }
  .sys .go { position: absolute; right: 18px; top: 16px;
    font-family: 'Jakarta', sans-serif; font-weight: 800; font-size: 11px;
    color: rgba(255,255,255,0.35); }

  .card { position: relative; width: 300px; height: 82px; background: #0d0d0d;
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; padding: 0 18px 0 22px; }
  .card .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .card .name { font-family: 'Anton', sans-serif; font-size: 17px; text-transform: uppercase;
    color: #fff; line-height: 1.1; }
  .card .type { font-family: 'Jakarta', sans-serif; font-weight: 700; font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.5);
    margin-top: 4px; }
  .card .go { position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-family: 'Jakarta', sans-serif; font-weight: 800; font-size: 13px;
    color: rgba(255,255,255,0.3); }
</style>
</head>
<body>
<div id="out"></div>
<script>
  const ORANGE = '#cf5230', GOLD = '#CAC18B';

  const SYSTEMS = [
    { id: 'aibacus', accent: ORANGE, role: 'AI / ML platform', name: 'Aibacus',
      body: 'Multi-tenant model services on an event-driven pipeline: streaming market data, feature and training pipelines, experiment tracking, live dashboards, and alerting across every service.',
      stack: 'Python · Go · Kafka · TimescaleDB · MLflow · Grafana' },
    { id: 'holmes', accent: GOLD, role: 'LLM application', name: 'Holmes AI',
      body: 'Retrieval-backed assistant that answers in a specific voice and cites its sources, with saved history, generated practices, and a themed, WCAG-AA interface.',
      stack: 'SvelteKit · TypeScript · Claude API · SQLite · Docker' },
    { id: 'webdevs', accent: ORANGE, role: 'Site + on-site assistant', name: 'webdevs.net',
      body: 'Marketing site with an embedded assistant: pluggable model backend (self-hosted or Claude API), request rate limiting, cancellable streaming, and scoped context.',
      stack: 'Next.js · TypeScript · Tailwind · GSAP · Ollama / Claude' },
  ];

  const CLIENTS = [
    { id: 'photosurgeon', accent: ORANGE, name: 'Photosurgeon', type: 'Web app' },
    { id: 'parkplaza',    accent: GOLD,   name: 'Park Plaza',   type: 'Website' },
    { id: 'tiamovail',    accent: ORANGE, name: 'Ti Amo Vail',  type: 'Mobile app' },
    { id: 'colleen',      accent: GOLD,   name: 'Colleen Wilcox', type: 'Sculpture' },
  ];

  const params = new URLSearchParams(location.search);
  const kind = params.get('kind') || 'sys';
  const i = Number(params.get('i') || 0);
  const out = document.getElementById('out');

  if (kind === 'sys') {
    const s = SYSTEMS[i];
    out.innerHTML = `<div class="sys">
      <div class="tick" style="background:${s.accent}"></div>
      <div class="go">↗</div>
      <div class="role" style="color:${s.accent}">${s.role}</div>
      <h3>${s.name}</h3>
      <p>${s.body}</p>
      <div class="stack">${s.stack}</div>
    </div>`;
  } else {
    const c = CLIENTS[i];
    out.innerHTML = `<div class="card">
      <div class="edge" style="background:${c.accent}"></div>
      <div class="go">↗</div>
      <div class="name">${c.name}</div>
      <div class="type">${c.type}</div>
    </div>`;
  }
</script>
</body>
</html>
